# Lightning Fury Caster Priority
# d2rloader/config/celestialrayone.lf-caster-priority.toml

[lf-caster-priority]

# Master switch.
enabled = true

# Mirror the server behaviour on the client so the visual bolt matches.
hook_client = true

# skills.txt aurafilter bit that marks a skill as caster-priority.
aurafilter_bit = 0x40000000

# Bolt count the hit must have for its bolt to go to the caster.
bolt_count = 1

# Require the caster to be within the skill's range of the impact point.
require_caster_in_range = true